name: Publish Radio Waajacu

on:
  push:
    branches: [main]
    paths:
      - 'projects/verbal-dexterity/web-radio/**'
      - '.github/workflows/radio-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radio-pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble verified public radio
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    container:
      # Official Python 3.13 slim bookworm image; registry digest checked 2026-10-24.
      image: python:3.13-slim-bookworm@sha256:e32be0e55814a08977501ca863271d9bd02443710db8f2afaf8372e2c4508530
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: projects/verbal-dexterity/web-radio
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      RADIO_WORKFLOW_PATH: ${{ github.workspace }}/.github/workflows/radio-pages.yml
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Install locked verification dependencies inside the container
        run: python -m pip install --require-hashes --no-cache-dir -r requirements.lock
      - name: Test export and publication contracts
        run: python -m pytest -q tests/test_static_export.py tests/test_pages_workflow.py
      - name: Assemble current player with the pinned media release
        run: python tools/export_static.py --publication publication.json --output /tmp/radio-pages --platform github-pages
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: /tmp/radio-pages
          retention-days: 1

  deploy:
    name: Deploy radio.waajacu.com
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy verified Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
